<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C5C"/>
      <stop offset="100%" stop-color="#1B6B7A"/>
    </linearGradient>
  </defs>

  <!-- rounded square badge -->
  <rect x="4" y="4" width="192" height="192" rx="36" fill="url(#bg)"/>

  <!-- curly braces, representing the marker syntax -->
  <text x="38" y="132"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="120"
        font-weight="bold"
        fill="#FFFFFF">{</text>
  <text x="108" y="132"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="120"
        font-weight="bold"
        fill="#FFFFFF">}</text>

  <!-- diagonal strike, representing stripping the marker -->
  <line x1="42" y1="150" x2="158" y2="50"
        stroke="#FF6B4A" stroke-width="14" stroke-linecap="round"/>
</svg>
