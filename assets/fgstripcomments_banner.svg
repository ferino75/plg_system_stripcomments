<svg viewBox="0 0 1200 525" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C5C"/>
      <stop offset="100%" stop-color="#1B6B7A"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="badgeShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="8" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="525" fill="url(#bg)"/>

  <!-- decorative soft circles -->
  <circle cx="1120" cy="60" r="180" fill="url(#glow1)"/>
  <circle cx="1050" cy="430" r="140" fill="url(#glow1)"/>
  <circle cx="60" cy="480" r="120" fill="url(#glow1)"/>

  <!-- logo column, independently vertically centered -->
  <g transform="translate(0, 88)">
    <rect x="90" y="50" width="220" height="220" rx="40" fill="#0B3945" filter="url(#badgeShadow)"/>
    <!-- curly braces baked as vector paths (extracted from DejaVu Serif Bold);
         right brace is an exact mirror of the left -> guaranteed symmetry,
         renders identically everywhere regardless of installed fonts -->
    <g transform="translate(117.08,197) scale(0.063477,-0.063477)">
      <path d="M1133 -213V-334H985Q749 -334 667.0 -309.5Q585 -285 535 -223Q506 -187 493.5 -132.0Q481 -77 481 35V285Q481 436 427.5 493.5Q374 551 233 551H172V672H233Q374 672 427.5 729.5Q481 787 481 938V1188Q481 1300 493.5 1355.0Q506 1410 535 1445Q585 1507 667.0 1531.5Q749 1556 985 1556H1133V1435H1013Q892 1435 857.5 1373.0Q823 1311 823 1141V860Q823 719 762.5 655.5Q702 592 522 572Q702 552 762.5 488.5Q823 425 823 284V4Q823 -166 857.5 -228.0Q892 -290 1013 -290H1133Z" fill="#FFFFFF"/>
    </g>
    <g transform="translate(282.92,197) scale(-0.063477,-0.063477)">
      <path d="M1133 -213V-334H985Q749 -334 667.0 -309.5Q585 -285 535 -223Q506 -187 493.5 -132.0Q481 -77 481 35V285Q481 436 427.5 493.5Q374 551 233 551H172V672H233Q374 672 427.5 729.5Q481 787 481 938V1188Q481 1300 493.5 1355.0Q506 1410 535 1445Q585 1507 667.0 1531.5Q749 1556 985 1556H1133V1435H1013Q892 1435 857.5 1373.0Q823 1311 823 1141V860Q823 719 762.5 655.5Q702 592 522 572Q702 552 762.5 488.5Q823 425 823 284V4Q823 -166 857.5 -228.0Q892 -290 1013 -290H1133Z" fill="#FFFFFF"/>
    </g>
    <line x1="120" y1="230" x2="280" y2="90" stroke="#FF6B4A" stroke-width="16" stroke-linecap="round"/>
    <text x="200" y="312" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">System plugin</text>
  </g>

  <!-- text column, independently vertically centered (already centered at translate 0) -->
  <g transform="translate(0, 0)">

    <!-- title -->
    <text x="390" y="105" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900">
      <tspan fill="#FF6B4A">FG</tspan>
      <tspan fill="#FFFFFF"> Strip Comments</tspan>
    </text>

    <!-- tagline -->
    <text x="392" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#CFE7EA">Backend notes, invisible on the front-end.</text>

    <!-- divider -->
    <line x1="392" y1="172" x2="1110" y2="172" stroke="#FF6B4A" stroke-width="2"/>

    <!-- feature list -->
    <g font-family="Arial, Helvetica, sans-serif">
      <circle cx="402" cy="216" r="6" fill="#FF6B4A"/>
      <text x="422" y="224" font-size="26" font-weight="bold" fill="#FFFFFF">Two scopes</text>
      <text x="422" y="252" font-size="20" fill="#CFE7EA">strip markers in titles &amp; links, or across the whole page</text>

      <circle cx="402" cy="288" r="6" fill="#FF6B4A"/>
      <text x="422" y="296" font-size="26" font-weight="bold" fill="#FFFFFF">Script/style safe</text>
      <text x="422" y="324" font-size="20" fill="#CFE7EA">never touches your JS or CSS code</text>

      <circle cx="402" cy="360" r="6" fill="#FF6B4A"/>
      <text x="422" y="368" font-size="26" font-weight="bold" fill="#FFFFFF">Configurable delimiters</text>
      <text x="422" y="396" font-size="20" fill="#CFE7EA">use {-- --} or your own custom markers</text>

      <circle cx="402" cy="432" r="6" fill="#FF6B4A"/>
      <text x="422" y="440" font-size="26" font-weight="bold" fill="#FFFFFF">Joomla 6 / PHP 8.1+</text>
      <text x="422" y="468" font-size="20" fill="#CFE7EA">modern plugin, auto-updates via JED</text>
    </g>
  </g>
</svg>
