PLG_SYSTEM_FGSTRIPCOMMENTS="FG Strip Comments"
PLG_SYSTEM_FGSTRIPCOMMENTS_XML_DESCRIPTION="Removes marker strings such as {-- note --} from the rendered front-end output (module titles, article titles, etc.), while leaving them visible in the back-end. A modern Joomla 6 replacement for the old BIGSHOT Strip Comments plugin."
PLG_SYSTEM_FGSTRIPCOMMENTS_SCOPE_LABEL="Scope"
PLG_SYSTEM_FGSTRIPCOMMENTS_SCOPE_DESC="Where to remove the markers. 'Titles only' strips them inside headings (h1-h6), the page title and link text (menu items, breadcrumbs), so body/paragraph text is never touched. 'Whole page' strips them everywhere in the output except inside &lt;script&gt; and &lt;style&gt; blocks, which are always left untouched."
PLG_SYSTEM_FGSTRIPCOMMENTS_SCOPE_ALL="Whole page"
PLG_SYSTEM_FGSTRIPCOMMENTS_SCOPE_TITLES="Titles only (headings, page title &amp; links)"
PLG_SYSTEM_FGSTRIPCOMMENTS_OPEN_DELIM_LABEL="Opening delimiter"
PLG_SYSTEM_FGSTRIPCOMMENTS_OPEN_DELIM_DESC="Start marker. Everything from here up to the closing delimiter is removed on the front-end. Default: {--"
PLG_SYSTEM_FGSTRIPCOMMENTS_CLOSE_DELIM_LABEL="Closing delimiter"
PLG_SYSTEM_FGSTRIPCOMMENTS_CLOSE_DELIM_DESC="End marker. Default: --}"
PLG_SYSTEM_FGSTRIPCOMMENTS_RUN_ADMIN_LABEL="Also run in administrator"
PLG_SYSTEM_FGSTRIPCOMMENTS_RUN_ADMIN_DESC="If enabled, markers are also stripped in the back-end. Off by default so you can still read your labels."
